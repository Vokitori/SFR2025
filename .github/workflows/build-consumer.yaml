name: Build Consumer Docker Image

on:
  push:
    branches:
      - StreamProcessor_CountryPublished  # oder main, je nachdem wo du arbeitest

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t consumer-app:latest ./Write-To-DB-Consumer

      - name: Export Docker Image as Archive (for KIND use)
        run: |
          docker save consumer-app:latest -o consumer.tar

      - name: Upload image artifact (optional)
        uses: actions/upload-artifact@v3
        with:
          name: consumer-image
          path: consumer.tar
